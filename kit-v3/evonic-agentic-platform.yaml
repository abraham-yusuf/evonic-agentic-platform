# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Evonic Agentic Platform
description: Evonic agent dashboard with local subprocess tool execution.
sourceUrl: https://github.com/anvie/evonic
licenses: [AGPL-3.0-only]

kind: workload
version: "0.1.0"

args:
  upstreamRef:
    default: "c902fae060192ac6261697598ce0034ce10b5819"
    pattern: '^[A-Za-z0-9._/-]+$'
    description: Pinned upstream Evonic git ref to build
    buildArg: EVONIC_REF

provides: ["evonic-agent@0.1.0"]

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/port@1
    description: Evonic dashboard
    config: {name: http, container: 8080}

  - type: com.docker.sandbox/volume@1
    description: Persistent Evonic data and shared files
    config: {path: /opt/evonic/shared, size: 2g}

  - type: com.docker.sandbox/resources@1
    config:
      cpu: 8.0
      memory: 16g

  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - pypi.org
          - files.pythonhosted.org
          - github.com
          - codeload.github.com
      runtime:
        allow:
          - '*.discord.com:443'
          - '*.openrouter.ai:443'
          - '*.slack.com:443'
          - api.anthropic.com:443
          - api.github.com:443
          - api.openai.com:443
          - api.telegram.org:443
          - codeload.github.com
          - discord.com:443
          - files.pythonhosted.org:443
          - generativelanguage.googleapis.com:443
          - github.com:443
          - openrouter.ai:443
          - pypi.org:443
          - slack.com:443
          - api.xingchiapi.com:443
          - '*.xingchiapi.com'
          - raon-api.krafton.ai:443
          - raon-api.krafton.ai
          - raon-mini.krafton.ai
          - '*.krafton.ai'
          - api.tokenlab.amd.com:443
          - api.tokenlab.amd.com
          - '*.amd.com'
          - trycloudflare.com
          - '*.trycloudflare.com'
          - cloudflare.com:443
          - '*.cloudflare.com'
          - alarm-pour-impacts-numerous.trycloudflare.com
