name: Validate Evonic Kit v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kit-v3/**'
      - '.github/workflows/push-kit-v3.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate descriptor and build content image
        run: docker buildx build ./kit-v3 -f ./kit-v3/evonic-agentic-platform.yaml --output type=cacheonly
