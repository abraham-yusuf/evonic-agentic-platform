name: Publish Evonic Kit v3 to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE: abrahamyusufai/evonic-agentic-platform

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: abrahamyusufai
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Kit v3 image
        run: |
          docker buildx build ./kit-v3 \
            -f ./kit-v3/evonic-agentic-platform.yaml \
            --platform linux/amd64,linux/arm64 \
            -t ${REGISTRY}/${IMAGE}:0.1.0 \
            -t ${REGISTRY}/${IMAGE}:latest \
            --push
