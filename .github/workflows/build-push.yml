# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/build-and-push.yml
# Auto-builds Evonic Docker image on: push, manual_dispatch, or cron weekly
# Result: ghcr.io/abraham-yusuf/evonic-agentic-platform:latest
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Push Evonic to GHCR

on:
  # Trigger manually from Actions tab or `gh workflow run`
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: latest
        type: string

  # Rebuild weekly to catch upstream Evonic updates
  schedule:
    - cron: "0 2 * * 0"   # every Sunday 02:00 UTC

  # Trigger on push to main (after you push new kit files)
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'app.py'
      - 'config.py'
      - 'cli/**'
      - 'backend/**'
      - 'lib/**'
      - 'routes/**'
      - 'static/**'
      - 'templates/**'
      - 'skills/**'
      - 'models/**'
      - 'plugins/**'
      - 'agent_templates/**'
      - 'agents/**'
      - 'shared/**'
      - 'defaults/**'
      - 'data/**'
      - 'evonic'
      - 'entrypoint.sh'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/evonic-agentic-platform

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (shallow clone for speed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag || 'latest' }}

      - name: Build and push (multi-arch: linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            UID=1000
            GID=1000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image URL
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 ghcr.io/${{ github.repository_owner }}/evonic-agentic-platform:latest"
          echo ""
          echo "To pull this image:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/evonic-agentic-platform:latest"
          echo ""
          echo "To use in Docker Agentic Platform:"
          echo "  ghcr.io/${{ github.repository_owner }}/evonic-agentic-platform:latest"
